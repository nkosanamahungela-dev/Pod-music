name: Pod Music debug APK
on:
  push:
    branches:
      - main
      - rename/pod-music-branding
      - fix/pod-music-update-feed-and-branding
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Restore persistent debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "Missing DEBUG_KEYSTORE_BASE64 repository secret" >&2
            exit 1
          fi
          echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/podmusic-debug.jks"
          chmod 600 "$RUNNER_TEMP/podmusic-debug.jks"
          echo "PODIUM_DEBUG_KEYSTORE_FILE=$RUNNER_TEMP/podmusic-debug.jks" >> "$GITHUB_ENV"
      - name: Build signed debug APK
        env:
          PODIUM_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          PODIUM_DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          PODIUM_DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$PODIUM_DEBUG_KEYSTORE_PASSWORD"
          test -n "$PODIUM_DEBUG_KEY_ALIAS"
          test -n "$PODIUM_DEBUG_KEY_PASSWORD"
          bash ./gradlew --no-daemon :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pod-music-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
